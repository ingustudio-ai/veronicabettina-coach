<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5E6C8;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#E8D5A3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C9A84C;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B6914;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D5A3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C9A84C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B6914;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8B6914" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer circle with gold gradient -->
  <circle cx="100" cy="100" r="95" fill="url(#goldGrad)" filter="url(#shadow)"/>
  
  <!-- Inner circle border -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#8B6914" stroke-width="2" opacity="0.5"/>
  
  <!-- Decorative ring -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#1A0A14" stroke-width="1" opacity="0.2"/>
  
  <!-- Isologo: Decorative V shape with leaf/branch -->
  <g transform="translate(100, 72)" fill="#1A0A14">
    <!-- V letter with elegant curves -->
    <path d="M-28,-8 L-14,28 L0,5 L14,28 L28,-8 L22,-8 L14,16 L0,-10 L-14,16 L-22,-8 Z" opacity="0.95"/>
    
    <!-- Small leaf accent on top of V -->
    <path d="M0,-22 C-3,-18 -8,-16 -10,-12 C-7,-14 -3,-14 0,-12 C3,-14 7,-14 10,-12 C8,-16 3,-18 0,-22 Z" opacity="0.85"/>
    
    <!-- Small branch stem -->
    <path d="M0,-12 L0,-4" stroke="#1A0A14" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>
  
  <!-- Letters "VB" -->
  <text x="100" y="135" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="600" fill="#1A0A14" letter-spacing="4" opacity="0.95">VB</text>
  
  <!-- Subtle decorative dots -->
  <circle cx="100" cy="42" r="2" fill="#1A0A14" opacity="0.4"/>
  <circle cx="100" cy="158" r="2" fill="#1A0A14" opacity="0.4"/>
  <circle cx="42" cy="100" r="2" fill="#1A0A14" opacity="0.4"/>
  <circle cx="158" cy="100" r="2" fill="#1A0A14" opacity="0.4"/>
  
  <!-- Outer decorative border -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="url(#goldBorder)" stroke-width="3"/>
</svg>
